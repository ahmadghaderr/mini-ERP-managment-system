version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: mini-ERP-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mini_ERP_system
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - mini-ERP-db-data:/var/lib/postgresql/data
volumes:
  mini-ERP-db-data: